<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title><!-- CONTENT:TITLE --></title>
<style>
/* ==========================================================================
   LIBRA BRAND — single source of visual identity for this document.
   Values taken from libraeurope.com's own design tokens. Change them here
   and nowhere else; nothing outside this block defines a colour or a font.
   The embedded logo and font files live in the BRAND ASSETS block at the
   bottom of this stylesheet.
   ========================================================================== */
:root {
  --libra-primary: #1e3a5f;      /* libra-navy — headings, cover, table header */
  --libra-primary-dark: #0f1f33; /* libra-navy-darker — cover gradient base */
  --libra-accent: #0891b2;       /* libra-teal — rules, journey card edge */
  --libra-ink: #2a2a3d;          /* slate-900 — body text */
  --libra-muted: #6b6b84;        /* slate-600 — secondary text */
  --libra-line: #e0e0e8;         /* slate-200 — rules and borders */
  --libra-wash: #f8f8fb;         /* slate-50 — tinted panels */
  --libra-paper: #ffffff;
  --libra-font: 'Outfit', 'Segoe UI', -apple-system, Arial, sans-serif;
  --libra-font-display: 'DM Serif Display', Georgia, 'Times New Roman', serif;
}
/* ====================== end LIBRA BRAND ================================== */

/* Page geometry. The margins here — not padding on <main> — are what reserve the
   top and bottom band on EVERY page: element padding applies only to the first and
   last fragment of a box, so a flowing document would otherwise start continuation
   pages flush against the paper edge.
   The cover claims its own named page so it can still bleed to the edges. */
@page { size: A4; margin: 18mm 0 16mm; }
@page cover-page { margin: 0; }

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: var(--libra-font);
  color: var(--libra-ink);
  background: var(--libra-paper);
  font-size: 10.5pt;
  line-height: 1.55;
}

/* --- Cover page ---------------------------------------------------------- */
.cover {
  page: cover-page;
  position: relative;
  height: 297mm;
  background: linear-gradient(160deg, var(--libra-primary) 0%, var(--libra-primary-dark) 100%);
  color: var(--libra-paper);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 30mm 22mm 24mm;
  page-break-after: always;
}
/* The reversed (white) Libra mark, embedded in the BRAND ASSETS block below.
   To change it, replace the --libra-logo data URI there — not this rule. */
.cover .wordmark {
  width: 46mm;
  height: 15.6mm;
  background-image: var(--libra-logo);
  background-repeat: no-repeat;
  background-position: left center;
  background-size: contain;
}
/* Brand strapline — sits with the logo as brand furniture, deliberately small
   so it never competes with the document title below. */
.cover .strapline {
  margin-top: 4mm;
  font-size: 9.5pt;
  font-weight: 300;
  line-height: 1.5;
  max-width: 70mm;
  color: var(--libra-paper);
  opacity: 0.6;
}
.cover .titles { margin-bottom: 18mm; }
.cover .rule {
  width: 28mm; height: 1.2mm;
  background: var(--libra-accent);
  margin-bottom: 10mm;
}
.cover h1 {
  font-family: var(--libra-font-display);
  font-size: 32pt;
  font-weight: 400;
  line-height: 1.15;
  margin-bottom: 6mm;
}
.cover .subtitle {
  font-size: 14pt;
  font-weight: 300;
  opacity: 0.85;
}
.cover .meta {
  font-size: 10pt;
  opacity: 0.75;
  line-height: 1.8;
}

/* --- Cover footer band ----------------------------------------------------
   The cover carries the branded strip; content pages deliberately do not.
   Do NOT reintroduce a `position: fixed` running footer: once @page margins
   exist, Chromium's print path places fixed elements unpredictably — tested
   output put the band at the top of one page and struck it through the middle
   of the text on the next. Per-page margins matter more than a running strip,
   and Chromium supports no reliable alternative (@page margin boxes and CSS
   running elements are both unimplemented). */
.cover-footer {
  position: absolute;   /* absolute, not a flex child: cannot alter cover layout or height */
  bottom: 0; left: 0; right: 0;
  height: 11mm;
  background: var(--libra-paper);
  border-top: 0.5mm solid var(--libra-accent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22mm;
  font-size: 7.5pt;
  color: var(--libra-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* --- Content pages --------------------------------------------------------
   Horizontal insets only — vertical space comes from the @page margins. */
main {
  padding: 0 22mm;
}
.doc-section { page-break-before: always; }
.doc-section:first-child { page-break-before: avoid; }

h2 {
  font-family: var(--libra-font-display);
  color: var(--libra-primary);
  font-size: 19pt;
  font-weight: 400;
  padding-bottom: 3mm;
  border-bottom: 0.4mm solid var(--libra-line);
  margin-bottom: 6mm;
}
h3 {
  color: var(--libra-primary);
  font-size: 13pt;
  font-weight: 600;
  margin: 8mm 0 3mm;
}
p { margin-bottom: 3.5mm; }
p.lead { font-size: 11.5pt; color: var(--libra-muted); }

/* --- Journey cards -------------------------------------------------------- */
.journey {
  background: var(--libra-wash);
  border-left: 1mm solid var(--libra-accent);
  border-radius: 1.5mm;
  padding: 5mm 6mm;
  margin: 4mm 0;
  page-break-inside: avoid;
}
.journey h4 {
  font-size: 11.5pt;
  font-weight: 600;
  color: var(--libra-primary);
  margin-bottom: 1.5mm;
}
.journey .ref {
  float: right;
  font-size: 7.5pt;
  color: var(--libra-muted);
  border: 0.25mm solid var(--libra-line);
  border-radius: 2mm;
  padding: 0.5mm 2mm;
  letter-spacing: 0.05em;
}
.journey .who {
  font-size: 9pt;
  color: var(--libra-muted);
  margin-bottom: 2.5mm;
}
.journey ol { margin: 0 0 2.5mm 5mm; }
.journey li { margin-bottom: 1.2mm; }
.journey .outcome { font-size: 9.5pt; }
.journey .outcome strong { color: var(--libra-primary); }

/* --- Roles ---------------------------------------------------------------- */
.role { margin-bottom: 3.5mm; page-break-inside: avoid; }
.role .role-name { font-weight: 600; color: var(--libra-primary); }

/* --- Delivery plan table --------------------------------------------------- */
table.phases {
  width: 100%;
  border-collapse: collapse;
  margin: 4mm 0;
  font-size: 9.5pt;
}
table.phases th {
  background: var(--libra-primary);
  color: var(--libra-paper);
  text-align: left;
  font-weight: 600;
  padding: 2.5mm 3mm;
}
table.phases td {
  padding: 2.5mm 3mm;
  border-bottom: 0.25mm solid var(--libra-line);
  vertical-align: top;
}
table.phases tr:nth-child(even) td { background: var(--libra-wash); }
table.phases tr { page-break-inside: avoid; }

/* --- Agreed exclusions ----------------------------------------------------- */
.exclusions {
  background: var(--libra-wash);
  border-radius: 1.5mm;
  padding: 5mm 6mm;
}
.exclusions ul { margin-left: 5mm; }
.exclusions li { margin-bottom: 1.5mm; }
